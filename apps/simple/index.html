<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState</title>
</head>
<script type="importmap">
{
  "imports": {
    "flow-state": "../../index.js"
  }
}
</script>
<body>
  <div id="app">
    <div>
      Count:<span flow-watch-count-to-prop="textContent"></span>
    </div>
    <button id="inc-btn">
      Increment
    </button>
  </div>
  <script type="module">
    import { FlowSource, flowWatch, flowDevtools } from 'flow-state';

    flowDevtools();

    const appEl = document.querySelector('#app');

    const state = new FlowSource(appEl, {
      count: 0
    });

    flowWatch(appEl, 'count', count => {
      console.log('count changed to', count);
    });

    const incBtn = document.querySelector('#inc-btn');

    incBtn.addEventListener('click', () => {
      state.update(prev => ({
        count: prev.count + 1
      }));
    });
  </script>
</body>
</html>
