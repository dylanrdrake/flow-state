<section class="panel">
  <header class="head">Reorder Suggestions</header>
  <div class="list" id="suggestions-list" flow-ul="reorderSuggestions">
    <template>
      <article class="item">
        <div class="line">
          <span class="sku" flow-li-prop="textContent: sku"></span>
          <span class="qty">Qty <span flow-li-prop="textContent: suggestedQty"></span></span>
        </div>
        <div class="meta" flow-li-prop="textContent: reason"></div>
        <button data-action="create" flow-li-attr="data-sku: sku; data-qty: suggestedQty">
          Create PO
        </button>
      </article>
    </template>
  </div>
  <template flow-if="hasReorderSuggestions">
    <span></span>
    <p class="empty">Nothing needs reordering.</p>
  </template>
</section>

<section class="panel">
  <header class="head">Purchase Orders</header>
  <div class="list" id="purchase-orders-list" flow-ul="purchaseOrders">
    <template>
      <article class="item">
        <div class="line">
          <span class="sku" flow-li-prop="textContent: sku"></span>
          <span class="qty">Qty <span flow-li-prop="textContent: qty"></span></span>
        </div>
        <div class="line">
          <span class="status" flow-li-prop="textContent: status"></span>
          <span class="meta">ETA <span flow-li-prop="textContent: etaDays"></span>d</span>
        </div>
        <button
          class="receive-btn"
          data-action="receive"
          flow-li-attr="data-po-id: id; data-status: status"
        >
          Receive
        </button>
      </article>
    </template>
  </div>
  <template flow-if="hasPurchaseOrders">
    <span></span>
    <p class="empty">No purchase orders yet.</p>
  </template>
</section>
