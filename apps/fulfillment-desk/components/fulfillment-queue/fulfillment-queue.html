<header class="head">Fulfillment Queue</header>
<div class="list" id="orders-list" flow-ul="fulfillmentQueue">
	<template>
		<article class="item">
			<div class="line">
				<span class="order-id">Order <span flow-li-prop="textContent: id"></span></span>
				<span class="status" flow-li-prop="textContent: status"></span>
			</div>
			<div class="line">
				<span class="sku" flow-li-prop="textContent: sku"></span>
				<span class="meta">Qty <span flow-li-prop="textContent: qty"></span></span>
			</div>
			<div class="line">
				<span class="meta" flow-li-prop="textContent: createdLabel"></span>
				<span flow-li-attr="class: availabilityClass" flow-li-prop="textContent: availabilityLabel"></span>
			</div>
			<button data-action="advance" flow-li-attr="data-order-id: id" flow-li-prop="textContent: nextLabel"></button>
		</article>
	</template>
</div>
<template flow-if="hasFulfillmentQueue">
	<span></span>
	<p class="empty">No active orders.</p>
</template>
