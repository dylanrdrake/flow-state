<section class="head">Inventory Editor</section>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>SKU</th>
        <th>Supplier</th>
        <th>Stock</th>
        <th>Reorder Point</th>
        <th>Lead Days</th>
        <th>Unit Cost</th>
      </tr>
    </thead>
    <tbody id="rows" flow-ul="filteredInventory">
      <template>
        <tr>
          <td>
            <div flow-li-prop="textContent: sku"></div>
            <div class="muted" flow-li-prop="textContent: name"></div>
          </td>
          <td><span class="supplier" flow-li-prop="textContent: supplier"></span></td>
          <td>
            <div class="stock-box">
              <button class="stock-btn" data-action="dec" flow-li-attr="data-sku: sku">-</button>
              <strong flow-li-prop="textContent: stock"></strong>
              <button class="stock-btn" data-action="inc" flow-li-attr="data-sku: sku">+</button>
            </div>
          </td>
          <td>
            <input
              class="reorder-input"
              type="number"
              min="0"
              step="1"
              data-field="reorder"
              flow-li-attr="data-sku: sku"
              flow-li-prop="value: reorderPoint"
            >
          </td>
          <td flow-li-prop="textContent: leadTimeDays"></td>
          <td flow-li-prop="textContent: unitCostLabel"></td>
        </tr>
      </template>
    </tbody>
  </table>
</div>
<template flow-if="hasFilteredInventory">
  <span></span>
  <p class="empty">No SKUs match the current filters.</p>
</template>
