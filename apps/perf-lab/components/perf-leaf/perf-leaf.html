<div class="leaf">
  <span class="leaf-path" flow-prop="textContent: leafPath">0.0</span>
  <span class="leaf-local" title="This leaf's own source">
    <span flow-prop="textContent: localValue">0</span>
  </span>
  <span class="leaf-echo" id="echo" title="Root-owned key, delivered via flowWatch">–</span>
  <template flow-if="hot">
    <span class="chip hot">hot</span>
    <span class="chip cool">cool</span>
  </template>
  <span class="bar"><i flow-attr="style: barStyle"></i></span>
</div>
