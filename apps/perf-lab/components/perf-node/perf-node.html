<section class="node">
  <header class="node-head">
    <span class="depth-chip" flow-prop="textContent: depthLabel">d0</span>
    <span class="node-label" flow-prop="textContent: nodeLabel">node</span>
    <span class="node-stat" title="This node's own source tick">
      <span flow-prop="textContent: localTick">0</span>
    </span>
    <span class="node-stat broadcast" title="Key owned by the root source, resolved through every ancestor">
      <span flow-prop="textContent: broadcast">–</span>
    </span>
  </header>
  <div class="kids" id="kids"></div>
</section>
