<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Editor Demo — FlowState</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link rel="stylesheet" href="./demo.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
<div id="shell">

  <div id="tab-bar">
    <button class="tab active" data-view="preview">Preview</button>
    <button class="tab"        data-view="code">Code</button>
  </div>

  <div id="preview-pane">
    <iframe src="./index.html" title="Item Editor"></iframe>
  </div>

  <div id="code-pane" hidden>
    <div id="file-tabs">
      <button class="file-tab active" data-file="index.html">index.html</button>
      <button class="file-tab" data-file="app.js">app.js</button>
      <button class="file-tab" data-file="side-bar.js">side-bar.js</button>
      <button class="file-tab" data-file="item-editor.js">item-editor.js</button>
    </div>
    <div id="code-scroll">
      <pre><code id="code-display"></code></pre>
    </div>
  </div>

</div>
<script>
  const cache = {};

  async function loadFile(filename) {
    if (cache[filename]) return cache[filename];
    const text = await fetch(`./${filename}`).then(r => r.text());
    cache[filename] = text;
    return text;
  }

  async function showFile(filename) {
    document.querySelectorAll('.file-tab').forEach(t =>
      t.classList.toggle('active', t.dataset.file === filename)
    );
    const codeEl = document.getElementById('code-display');
    const text = await loadFile(filename);
    const lang = filename.endsWith('.json') ? 'json'
               : filename.endsWith('.html') ? 'html'
               : 'javascript';
    codeEl.className = `language-${lang}`;
    codeEl.textContent = text;
    codeEl.removeAttribute('data-highlighted');
    if (window.hljs) hljs.highlightElement(codeEl);
  }

  // Main tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const view = tab.dataset.view;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      document.getElementById('preview-pane').hidden = view !== 'preview';
      document.getElementById('code-pane').hidden    = view !== 'code';
      if (view === 'code') {
        const active = document.querySelector('.file-tab.active')?.dataset.file ?? 'index.html';
        showFile(active);
      }
    });
  });

  // File tab switching
  document.querySelectorAll('.file-tab').forEach(tab => {
    tab.addEventListener('click', () => showFile(tab.dataset.file));
  });
</script>
</body>
</html>
