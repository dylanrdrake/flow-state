<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/FlowState3_transparent.svg">
  <title>FlowState DevTools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a1b26;
      --bg2:      #16161e;
      --bg3:      #24283b;
      --border:   #2a2d3e;
      --text:     #c0caf5;
      --text-dim: #565f89;
      --bright:   #e0e0ff;
      --accent:   #7aa2f7;
      --green:    #9ece6a;
      --yellow:   #e0af68;
      --red:      #f7768e;
      --purple:   #bb9af7;
      --cyan:     #7dcfff;
      --graph-bg-end: #1b1d2a;
      --graph-node-fill: rgba(122,162,247,0.08);
      --graph-node-stroke: rgba(122,162,247,0.45);
      --graph-node-selected-fill: rgba(122,162,247,0.14);
      --graph-node-flash-start: rgba(122,162,247,0.28);
      --graph-node-flash-end: rgba(122,162,247,0.08);
      --graph-edge-stroke: rgba(122,162,247,0.38);
      --graph-label: #7dcfff;
      --graph-stats: #565f89;
      --theme-button-bg: transparent;
      --theme-button-bg-hover: var(--bg3);
      --theme-button-border: var(--border);
      --theme-button-text: var(--text);
    }

    :root[data-theme='light'] {
      --bg:       #ffffff;
      --bg2:      #ffffff;
      --bg3:      #f6f6f6;
      --border:   #dcdcdc;
      --text:     #0e1b1b;
      --text-dim: #636363;
      --bright:   #0e1b1b;
      --accent:   #4a4a4a;
      --green:    #3f7a52;
      --yellow:   #8a7820;
      --red:      #a83838;
      --purple:   #7359b5;
      --cyan:     #2f6f7a;
      --graph-bg-end: #f6f6f6;
      --graph-node-fill: rgba(74,74,74,0.06);
      --graph-node-stroke: rgba(74,74,74,0.38);
      --graph-node-selected-fill: rgba(74,74,74,0.12);
      --graph-node-flash-start: rgba(74,74,74,0.2);
      --graph-node-flash-end: rgba(74,74,74,0.08);
      --graph-edge-stroke: rgba(74,74,74,0.28);
      --graph-label: #4a4a4a;
      --graph-stats: #636363;
      --theme-button-bg: #f8f8f8;
      --theme-button-bg-hover: #ffffff;
      --theme-button-border: #dcdcdc;
      --theme-button-text: #4a4a4a;
    }

    html, body { height: 100%; font-family: 'Menlo', 'Consolas', 'Monaco', monospace; background: var(--bg); color: var(--text); font-size: 12px; line-height: 1.5; }

    #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Header ─────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.03em;
    }

    .logo-icon {
      width: 16px;
      height: 16px;
      display: inline-block;
      flex-shrink: 0;
    }

    .logo-icon-color { display: none; }
    .logo-icon-mono { display: inline-block; }

    :root[data-theme='light'] .logo-icon-color { display: inline-block; }
    :root[data-theme='light'] .logo-icon-mono { display: none; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #theme-toggle {
      border: 1px solid var(--theme-button-border);
      color: var(--theme-button-text);
      background: var(--theme-button-bg);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      line-height: 1.2;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    #theme-toggle:hover {
      background: var(--theme-button-bg-hover);
    }

    #status { font-size: 11px; color: var(--text-dim); transition: color 0.3s; }
    #status.connected { color: var(--green); }

    /* ── Main layout ─────────────────────────── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Tree panel ──────────────────────────── */
    #tree-panel {
      width: var(--tree-width, 320px);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg2);
      overflow: hidden;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #sources-section {
      border-bottom: 1px solid var(--border);
    }

    #inspector-section {
      min-height: 90px;
    }

    #sidebar-split-handle {
      height: 6px;
      flex-shrink: 0;
      cursor: row-resize;
      background: transparent;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
      position: relative;
      z-index: 1;
    }

    #sidebar-split-handle:hover,
    #sidebar-split-handle.dragging {
      background: var(--accent);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #tree { flex: 1; overflow-y: auto; padding: 4px 0; }

    /* ── Main content ────────────────────────── */
    #main-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg2);
    }

    /* ── Graph panel ─────────────────────────── */
    #graph-panel {
      flex: 1;
      min-height: 0;
      background: linear-gradient(180deg, var(--bg2) 0%, var(--graph-bg-end) 100%);
      position: relative;
      overflow: hidden;
    }

    #graph-svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }

    #graph-svg.panning {
      cursor: grabbing;
    }

    .graph-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 11px;
      letter-spacing: 0.03em;
      pointer-events: none;
    }

    .graph-node {
      cursor: pointer;
      transition: opacity 0.12s;
    }

    .graph-node:hover rect {
      stroke: var(--yellow);
    }

    .graph-node.selected rect {
      stroke: var(--accent);
      fill: var(--graph-node-selected-fill);
    }

    .graph-node.highlighted rect {
      stroke: rgba(224, 175, 104, 0.95);
      fill: rgba(224, 175, 104, 0.18);
      stroke-width: 1.4;
    }

    .graph-node.flash rect {
      animation: graphPulse 0.55s ease-out;
    }

    @keyframes graphPulse {
      0% { fill: var(--graph-node-flash-start); }
      100% { fill: var(--graph-node-flash-end); }
    }

    /* ── Tree nodes ──────────────────────────── */
    .tree-node { cursor: pointer; user-select: none; }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 4px;
      margin: 1px 4px;
      transition: background 0.1s;
    }

    .tree-node:hover .tree-row { background: var(--bg3); }
    .tree-node.selected .tree-row { background: rgba(122, 162, 247, 0.18); }
    .tree-node.highlighted .tree-row { background: rgba(224, 175, 104, 0.18); outline: 1px solid rgba(224,175,104,0.4); outline-offset: -1px; }

    @keyframes flash { 0% { background: rgba(122,162,247,0.25); } 100% { background: transparent; } }
    .tree-node.flash .tree-row { animation: flash 0.6s ease-out; }

    .tree-toggle { color: var(--text-dim); width: 11px; flex-shrink: 0; font-size: 9px; }
    .tree-tag { color: var(--accent); font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .tree-badges { display: flex; gap: 3px; flex-shrink: 0; }
    .badge { padding: 1px 4px; border-radius: 3px; font-size: 9px; font-weight: 700; }
    .badge.keys  { background: rgba(122,162,247,0.12); color: var(--accent); }
    .badge.watch { background: rgba(224,175,104,0.12); color: var(--yellow); }
    .badge.comp  { background: rgba(187,154,247,0.12); color: var(--purple); }

    .tree-age { color: var(--text-dim); font-size: 9px; flex-shrink: 0; min-width: 26px; text-align: right; }

    /* ── Resize handle ───────────────────────── */
    #resize-handle {
      width: 4px;
      flex-shrink: 0;
      cursor: col-resize;
      background: transparent;
      transition: background 0.15s;
      position: relative;
      z-index: 1;
    }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

    /* ── Detail panel ────────────────────────── */
    #detail { flex: 1; overflow-y: auto; padding: 0 18px 14px; min-height: 0; }

    /* ── Empty states ────────────────────────── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 10px; color: var(--text-dim); font-size: 13px; text-align: center;
    }
    .empty-icon { font-size: 36px; color: var(--border); line-height: 1; }
    .empty-state code { background: var(--bg3); padding: 3px 8px; border-radius: 4px; color: var(--accent); font-size: 12px; }

    /* ── Detail content ──────────────────────── */
    .detail-header {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      margin: 0 -18px 0;
      padding: 6px 18px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .detail-title-row { display: flex; align-items: baseline; gap: 10px; }
    .detail-tag { font-size: 17px; font-weight: 700; color: var(--accent); }
    .detail-class-name { font-weight: 700; }
    .detail-root-tag { font-weight: 400; font-size: 14px; }
    .detail-id  { font-size: 10px; color: var(--text-dim); }
    .detail-shadow-row { font-size: 10px; color: var(--text-dim); }

    .detail-meta { margin: 14px 0 18px; display: flex; flex-direction: column; gap: 5px; }
    .meta-row   { display: flex; gap: 12px; }
    .meta-label { color: var(--text-dim); width: 90px; flex-shrink: 0; }
    .meta-val   { color: var(--text); }

    .section-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-dim); margin-bottom: 8px;
    }

    /* ── Value tree ──────────────────────────── */
    .value-row { display: flex; align-items: baseline; gap: 5px; padding: 2px 0; }

    .value-key-row {
      display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 1px 0; border-radius: 3px;
    }
    .value-key-row:hover { color: var(--bright); }

    .value-toggle { color: var(--text-dim); width: 11px; flex-shrink: 0; font-size: 9px; }
    .value-key          { color: var(--cyan); }
    .value-key.computed { color: var(--red); }
    .value-key.action   { color: var(--green); }
    .value-key.watched  { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
    .value-key::after   { content: ':'; color: var(--text-dim); margin-left: 1px; }
    .arr-index          { color: var(--text-dim); }
    .arr-index::after   { content: ':'; }
    .value-type         { color: var(--text-dim); font-style: italic; }

    .val-str  { color: var(--green); }
    .val-num  { color: var(--yellow); }
    .val-bool { color: var(--purple); }
    .val-null { color: var(--text-dim); font-style: italic; }
    .val-computed { color: var(--text-dim); font-style: italic; }
    .val-action { color: var(--text-dim); font-style: italic; }

    .value-more { color: var(--text-dim); font-style: italic; padding: 2px 0 2px 16px; }

    /* ── Watcher list ────────────────────────── */
    .watcher-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
    .watcher-row  { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
    .watcher-source { color: var(--accent); font-size: 11px; }
    .watcher-source:hover { cursor: pointer; text-decoration: underline; }
    .watcher-arrow  { color: var(--text-dim); font-size: 10px; flex-shrink: 0; }
    .watcher-key    { color: var(--cyan); font-size: 11px; }
    .watcher-key:hover { cursor: pointer; }

    /* ── Scrollbars ──────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="logo">
        <img class="logo-icon logo-icon-color" src="../assets/FlowState3_transparent.svg" alt="FlowState logo color">
        <img class="logo-icon logo-icon-mono" src="../assets/FlowState_light_transparent.svg" alt="FlowState logo dark-mode variant">
        <span>FlowState DevTools</span>
      </span>
      <div class="header-right">
        <button id="theme-toggle" type="button" aria-label="Toggle color theme">Light</button>
        <span id="status">○ Waiting for app…</span>
      </div>
    </header>
    <div id="main">
      <div id="tree-panel">
        <div id="sources-section" class="sidebar-section">
          <div class="panel-header">
            <span>Sources</span>
            <span id="source-count">0</span>
          </div>
          <div id="tree"></div>
        </div>
        <div id="sidebar-split-handle"></div>
        <div id="inspector-section" class="sidebar-section">
          <div class="panel-header">Source Inspector</div>
          <div id="detail"></div>
        </div>
      </div>
      <div id="resize-handle"></div>
      <div id="main-content">
        <div class="panel-header">
          <span>Source Graph</span>
          <span></span>
        </div>
        <div id="graph-panel">
          <svg id="graph-svg"></svg>
          <div id="graph-empty" class="graph-empty">Waiting for graph data…</div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./devtools.js"></script>
</body>
</html>
